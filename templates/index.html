<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Estilo Instagram</title>
    <!-- Conexión dinámica al archivo CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="https://ui-avatars.com/api/?name=Bot&background=random" alt="Bot Profile" class="profile-pic">
            <h3>Asistente Virtual</h3>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">¡Hola! ¿En qué te puedo ayudar hoy? 😊</div>
        </div>
        
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input type="text" id="user-input" placeholder="Envía un mensaje..." autocomplete="off" onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');

        // Escucha la tecla Enter para enviar
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Muestra el mensaje del usuario
            appendMessage(text, 'user');
            userInput.value = '';

            try {
                // Envía los datos al backend de Flask
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Muestra la respuesta del bot
                appendMessage(data.response, 'bot');
            } catch (error) {
                console.error('Error de conexión:', error);
                appendMessage('Error de conexión con el servidor.', 'bot');
            }
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            
            // Auto-scroll al fondo del chat
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
